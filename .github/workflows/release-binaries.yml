name: Release binaries

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build cross-platform binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"   # v20260808-1 -> 20260808-1
          BIN="xwiki-mcp"
          mkdir -p dist

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for p in "${platforms[@]}"; do
            GOOS="${p%/*}"
            GOARCH="${p#*/}"

            stage="${BIN}"
            binname="${BIN}"
            if [ "$GOOS" = "windows" ]; then
              binname="${BIN}.exe"
            fi

            echo "::group::Building ${GOOS}/${GOARCH} (${VERSION})"
            rm -rf "$stage"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "$stage/$binname" .
            if [ -f LICENSE ]; then cp LICENSE "$stage/LICENSE"; fi
            if [ -f README.md ]; then cp README.md "$stage/README.md"; fi
            echo "::endgroup::"

            if [ "$GOOS" = "windows" ]; then
              zip -qr "dist/${BIN}_${GOOS}_${GOARCH}.zip" "$stage"
            else
              tar -czf "dist/${BIN}_${GOOS}_${GOARCH}.tar.gz" "$stage"
            fi
            rm -rf "$stage"
          done

          cd dist
          sha256sum * > SHA256SUMS
          echo "Artifacts:"
          ls -la

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}